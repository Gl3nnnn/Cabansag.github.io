<svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Illustrated portrait of a woman with long hair">
  <defs>
    <clipPath id="a2"><circle cx="60" cy="60" r="60"/></clipPath>
    <linearGradient id="a2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a3f8c"/>
      <stop offset="1" stop-color="#431f52"/>
    </linearGradient>
    <linearGradient id="a2skin" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f0c49c"/>
      <stop offset="1" stop-color="#d69b6c"/>
    </linearGradient>
    <linearGradient id="a2hair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3a2a20"/>
      <stop offset="1" stop-color="#221812"/>
    </linearGradient>
    <linearGradient id="a2top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0698f"/>
      <stop offset="1" stop-color="#c24a72"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#a2)">
    <rect width="120" height="120" fill="url(#a2bg)"/>

    <!-- back hair, behind everything -->
    <path d="M60 20c-20 0-30 13-30 32 0 14 2 24 4 32h52c2-8 4-18 4-32 0-19-10-32-30-32z" fill="url(#a2hair)"/>

    <!-- shoulders and top -->
    <path d="M60 80c-18 0-31 10-34 24l-2 16h72l-2-16c-3-14-16-24-34-24z" fill="url(#a2top)"/>
    <!-- neckline -->
    <path d="M52 80c2 5 5 7 8 7s6-2 8-7l-8-4-8 4z" fill="#f7c9b0"/>
    <!-- neck -->
    <path d="M53 63h14v17c0 4-14 4-14 0V63z" fill="#d69b6c"/>
    <path d="M53 63h14v6c-4 3-10 3-14 0v-6z" fill="#b98252"/>

    <!-- head -->
    <ellipse cx="60" cy="46" rx="22" ry="25" fill="url(#a2skin)"/>
    <!-- ears -->
    <ellipse cx="38.5" cy="48" rx="3.6" ry="5" fill="#e0a87c"/>
    <ellipse cx="81.5" cy="48" rx="3.6" ry="5" fill="#e0a87c"/>

    <!-- front hair with a side part -->
    <path d="M60 20c-19 0-29 12-29 29 0 5 1 9 2 12 1-9 3-14 6-17 2 3 5 4 8 3-1-3-1-6 0-8 4 4 13 6 22 4 4-1 7-2 9-4 2 3 3 8 3 15 1-3 2-7 2-12 0-14-10-22-23-22z" fill="url(#a2hair)"/>

    <!-- brows -->
    <path d="M48 43c3-2 7-2 10 0" stroke="#2a1d15" stroke-width="2.3" fill="none" stroke-linecap="round"/>
    <path d="M62 43c3-2 7-2 10 0" stroke="#2a1d15" stroke-width="2.3" fill="none" stroke-linecap="round"/>
    <!-- eyes with lashes -->
    <ellipse cx="53" cy="50" rx="3.1" ry="3.6" fill="#241a13"/>
    <ellipse cx="67" cy="50" rx="3.1" ry="3.6" fill="#241a13"/>
    <circle cx="54.2" cy="49" r="1.1" fill="#ffffff"/>
    <circle cx="68.2" cy="49" r="1.1" fill="#ffffff"/>
    <path d="M49.5 47.5c2-1.6 4.6-1.6 6.6 0" stroke="#241a13" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M63.9 47.5c2-1.6 4.6-1.6 6.6 0" stroke="#241a13" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- nose -->
    <path d="M60 51v6c0 1.4-1 1.9-2.4 1.9" stroke="#bd8259" stroke-width="2.1" fill="none" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M52.5 62c4 4 11 4 15 0" stroke="#96486a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
