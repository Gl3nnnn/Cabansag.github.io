<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>404 - Page Not Found | Glenn Patrick Cabansag</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="canonical" href="https://gl3nnnn.github.io/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></noscript>
    <style>
        :root{--bg:#121212;--panel:#1e1e1e;--main:#1bb30e;--accent:#03dac6;--text:#e0e0e0;--muted:#9aa0a6;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Poppins',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;}
        body::before{content:"";position:fixed;inset:0;background:radial-gradient(600px at 50% 20%,rgba(27,179,14,.14),transparent 60%);pointer-events:none;z-index:-1;}
        .code{font-size:clamp(6rem,20vw,12rem);font-weight:800;line-height:1;color:var(--main);text-shadow:0 0 40px rgba(27,179,14,.5);}
        .code i{color:var(--accent);text-shadow:0 0 40px rgba(3,218,198,.5);}
        h1{color:#fff;font-size:clamp(1.5rem,4vw,2.2rem);margin:1.2rem 0 .8rem;}
        p{color:var(--muted);font-size:1.05rem;max-width:520px;margin:0 auto 2rem;line-height:1.7;}
        .actions{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;}
        a{display:inline-flex;align-items:center;gap:.6rem;font-weight:600;font-size:.98rem;padding:.85rem 1.9rem;border-radius:999px;transition:.25s;text-decoration:none;}
        .btn{background:var(--main);color:#000;border:2px solid var(--main);}
        .btn:hover{box-shadow:0 0 24px rgba(27,179,14,.55);transform:translateY(-2px);}
        .btn-ghost{color:var(--accent);border:2px solid var(--accent);}
        .btn-ghost:hover{background:var(--accent);color:#000;box-shadow:0 0 24px rgba(3,218,198,.5);transform:translateY(-2px);}
        footer{margin-top:3.5rem;color:var(--muted);font-size:.85rem;}
        footer span{color:var(--accent);}
        :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:.3rem;}
    </style>
</head>
<body>
    <div class="code"><i class="fa-solid fa-bug"></i> 4<i>0</i>4</div>
    <h1>Oops! That page got lost.</h1>
    <p>The link may be broken, or the page may have moved. Let's get you back on track — try the home page or the FAQ.</p>
    <div class="actions">
        <a class="btn" href="index.html"><i class="fa-solid fa-house"></i> Back to Home</a>
        <a class="btn-ghost" href="faq.html"><i class="fa-solid fa-circle-question"></i> Visit FAQ</a>
    </div>
    <footer>&copy; <span id="year"></span> Glenn Patrick Cabansag</footer>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
